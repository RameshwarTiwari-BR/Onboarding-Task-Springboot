spring.application.name=springboot-onboarding
# Application Configuration

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/springboot_onboarding
spring.datasource.username=postgres
spring.datasource.password=MyStrongPass123

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.file.name=logs/springboot-onboarding.log

# 1. Enable detailed web logging
logging.level.org.springframework.web=DEBUG

# 2. Log exactly what data comes into your request interceptors
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

