spring:
  application:
    name: springboot-onboarding

  datasource:
    url: jdbc:postgresql://localhost:5432/springboot_onboarding
    username: postgres
    password: SpringSecure123

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/Onboarding
      client:
        registration:
          keycloak-admin:
            provider: keycloak
            client-id: onboarding-admin
            client-secret: 2L62rIvdNdKduaEefBuuKT9BK5mXYCRWhwmTrQ2fHL8xmi3LH6cWJBwie3vuuXxvtfYM3i5cQzDyqad5CsjU0Q
            authorization-grant-type: client_credentials
            scope: kc-admin-api
        provider:
          keycloak:
            token-uri: http://localhost:8081/realms/Onboarding/protocol/openid-connect/token

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

keycloak:
  admin:
    base-url: http://localhost:8081
    realm: Onboarding
    issuer: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
    login-client-id: <YOUR_FRONTEND_CLIENT_ID>

logging:
  file:
    name: logs/springboot-onboarding.log
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId}] %logger{36} - %msg%n"
