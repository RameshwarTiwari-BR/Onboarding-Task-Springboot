spring:
  application:
    name: springboot-onboarding
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15

  flyway:
    enabled: true
    clean-disabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Must match the 'iss' claim inside the token (browser-facing URL)
          issuer-uri: ${KEYCLOAK_BASE_URL}/realms/${KEYCLOAK_REALM}
          # Fetched directly container-to-container over Docker network
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:${KEYCLOAK_BASE_URL}}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      client:
        registration:
          keycloak-admin:
            provider: keycloak
            client-id: onboarding-admin
            client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: kc-admin-api
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_INTERNAL_URL:${KEYCLOAK_BASE_URL}}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

keycloak:
  admin:
    base-url: ${KEYCLOAK_INTERNAL_URL:${KEYCLOAK_BASE_URL}}
    realm: ${KEYCLOAK_REALM}
    issuer: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
    login-client-id: onboarding-client

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  file:
    name: logs/springboot-onboarding.log
#  structured:
#    format:
#      console: ecs  # elastic Comman Schema Json for Grafana like tools can easily parse json then simple text
#      file: ecs
  level:
    org.springframework.security: warn
    org.hibernate.SQL: warn
    org.springframework.web: warn
    org.springframework.web.servlet.DispatcherServlet: warn
    org.hibernate.orm.jdbc.error: error
    root: info
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId}] %logger{36} - %msg%n"


server:
  shutdown: graceful