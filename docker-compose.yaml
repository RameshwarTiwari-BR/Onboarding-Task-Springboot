services:
  springboot-onboarding:
    image: ${APP_IMAGE_NAME}:${APP_IMAGE_TAG}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8080"
    env_file:
      - .env.docker
    volumes:
      - ./logs:/app/logs
    networks:
      - existing_infra_network

networks:
  existing_infra_network:
    name: ${DOCKER_NETWORK_NAME}
    external: true
